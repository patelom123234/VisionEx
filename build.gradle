plugins {
    id 'java'
    id 'application'
    id 'com.google.protobuf' version '0.9.4'
}

group = 'com.visionex'
version = '1.0.0'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'io.grpc:grpc-netty-shaded:1.62.2'
    implementation 'io.grpc:grpc-protobuf:1.62.2'
    implementation 'io.grpc:grpc-stub:1.62.2'
    implementation 'com.linecorp.armeria:armeria:1.25.2'
    implementation 'com.linecorp.armeria:armeria-grpc:1.25.2'
    implementation 'com.google.protobuf:protobuf-java:3.25.3'
    implementation 'com.google.protobuf:protobuf-java-util:3.25.3'
    implementation 'com.google.cloud:google-cloud-vision:3.40.0'
    implementation 'com.google.cloud:google-cloud-document-ai:3.35.0'
    implementation 'com.google.cloud:google-cloud-storage:2.34.0'
    implementation 'com.google.cloud:google-cloud-secretmanager:2.38.0'
    implementation 'com.google.firebase:firebase-admin:9.3.0'
    implementation 'io.github.cdimascio:dotenv-java:3.0.0'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.17.1'
    implementation 'com.fasterxml.jackson.core:jackson-core:2.17.1'
    implementation 'com.fasterxml.jackson.core:jackson-annotations:2.17.1'
    implementation 'org.slf4j:slf4j-simple:2.0.12'
    implementation 'javax.annotation:javax.annotation-api:1.3.2'
}

application {
    mainClass = 'com.visionex.ServerMain'
}

protobuf {
    protoc {
        artifact = 'com.google.protobuf:protoc:3.25.3'
    }
    plugins {
        grpc {
            artifact = 'io.grpc:protoc-gen-grpc-java:1.62.2'
        }
    }
    generateProtoTasks {
        all().each { task ->
            task.plugins {
                grpc {}
            }
        }
    }
}
